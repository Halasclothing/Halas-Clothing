name: Restore previous HALAS scroll animation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-previous-scroll-animation.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the previous animation files
        run: |
          git fetch origin 37352d8ad783b066e93dc822b29f904a40bc7cc1
          git checkout 37352d8ad783b066e93dc822b29f904a40bc7cc1 -- src/components/ScrollFramesBackground.tsx public/scroll-frames/
          rm .github/workflows/restore-previous-scroll-animation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore previous HALAS scroll animation"
          git push origin main
