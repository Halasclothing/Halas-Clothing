name: Import HALAS updated website

on:
  push:
    branches: [main]
    paths:
      - "HALAS-part-*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract updated website parts
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2 3; do
            test -f "HALAS-part-${part}.zip" || { echo "Missing HALAS-part-${part}.zip. Upload all three parts in one commit."; exit 1; }
          done
          mkdir -p /tmp/halas-import
          for part in 1 2 3; do
            unzip -oq "HALAS-part-${part}.zip" -d /tmp/halas-import
          done
          test -f /tmp/halas-import/halas/package.json || { echo "Expected halas/package.json inside the extracted parts."; exit 1; }
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/halas-import/halas/ ./
          rm -f HALAS-part-1.zip HALAS-part-2.zip HALAS-part-3.zip

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy updated HALAS Clothing website"
          git push origin HEAD:main
